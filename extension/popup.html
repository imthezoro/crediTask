<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PromptOK Login</title>
    <style>
      body { font-family: sans-serif; padding: 12px; width: 280px; }
      input { width: 100%; margin: 6px 0; padding: 6px; }
      button { width: 100%; padding: 8px; }
      .status { font-size: 12px; color: #666; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h3>Sign in</h3>
    <input id="email" type="email" placeholder="email" />
    <input id="password" type="password" placeholder="password" />
    <button id="login">Login</button>
    <div class="status" id="status"></div>
    <script>
      document.getElementById('login').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
          const res = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (data.access_token) {
            await chrome.runtime.sendMessage({ type: 'SET_TOKEN', token: data.access_token });
            document.getElementById('status').textContent = 'Logged in';
          } else {
            document.getElementById('status').textContent = 'Login failed';
          }
        } catch (e) {
          document.getElementById('status').textContent = 'Error';
        }
      });
    </script>
  </body>
  </html>
