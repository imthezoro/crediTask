<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PromptOK</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- Logged In View -->
      <div id="loggedInView" class="view" style="display: none;">
        <div class="profile-header">
          <div class="logo">PromptOK</div>
          <div class="user-info">
            <div class="user-avatar" aria-hidden="true"><span class="initials"></span></div>
            <div class="user-details">
              <h3 id="userName"></h3>
              <p id="userEmail"></p>
            </div>
          </div>
          
          <div class="plan-info">
            <div class="plan-badge">
              <!-- Gem icon -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="margin-right:4px;">
                <path d="M3.617 8.943L2 6l4-4h12l4 4-1.617 2.943L12 22 3.617 8.943zM9 4l-2 2 2 2 2-2-2-2zm6 0l-2 2 2 2 2-2-2-2zM5 6l-1 2h4L5 6zm10 2h4l-1-2-3 2zm-3.999 1.999L8 10l4 8 4-8-3.999-.001z"/>
              </svg>
              <span></span>
            </div>
            <p class="plan-text">Current Plan</p>
            <div class="credits">
              <!-- Coins icon -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="margin-right:4px;">
                <path d="M12 4C7.589 4 4 5.79 4 8s3.589 4 8 4 8-1.79 8-4-3.589-4-8-4zm0 10c-4.411 0-8-1.79-8-4v3c0 2.21 3.589 4 8 4s8-1.79 8-4v-3c0 2.21-3.589 4-8 4zm0 6c-4.411 0-8-1.79-8-4v3c0 2.21 3.589 4 8 4s8-1.79 8-4v-3c0 2.21-3.589 4-8 4z"/>
              </svg>
              <span>Credits</span>
              <span class="credit-count"></span>
            </div>
          </div>
        </div>
        
        <div class="nav-section">
          <a id="linkDashboard" href="http://localhost:3000/dashboard" target="_blank" class="nav-item">
            <!-- Gauge icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3a9 9 0 00-9 9h2a7 7 0 0114 0h2a9 9 0 00-9-9zm-1 9l-5 5 1.414 1.414L12 14.828l3.586 3.586L17 17l-5-5z"/>
            </svg>
            <span>Dashboard</span>
            <p>Build out your super prompts</p>
          </a>
          
          <a id="linkBilling" href="http://localhost:3000/billing" target="_blank" class="nav-item">
            <!-- Credit card icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 6h20v12H2V6zm2 2v2h16V8H4zm0 6h6v2H4v-2z"/>
            </svg>
            <span>Billing</span>
            <p>Manage plan & payment</p>
          </a>
          
          <a id="linkProfile" href="http://localhost:3000/profile" target="_blank" class="nav-item">
            <!-- User icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12c2.761 0 5-2.686 5-6s-2.239-6-5-6-5 2.686-5 6 2.239 6 5 6zm0 2c-4.418 0-8 2.239-8 5v3h16v-3c0-2.761-3.582-5-8-5z"/>
            </svg>
            <span>Profile</span>
            <p>Manage your account</p>
          </a>
        </div>
        
        <div class="divider"></div>
        
        <div class="nav-section">
          <a href="https://help.promptok.com" target="_blank" class="nav-item">
            <!-- Question circle icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1 .45-1.75 1.17-2.47l1.24-1.26A1.99 1.99 0 0014 9a2 2 0 10-4 0H8a4 4 0 118 0c0 .88-.36 1.68-.93 2.25z"/>
            </svg>
            <span>Help & Support</span>
            <p>Get help and contact support</p>
          </a>
          
          <a href="https://chrome.google.com/webstore/detail/promptok/" target="_blank" class="nav-item">
            <!-- Info circle icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M11 17h2v-6h-2v6zm0-8h2V7h-2v2zm1-7C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2z"/>
            </svg>
            <span>About</span>
            <p>Extension Store Page</p>
          </a>
        </div>
        
        <button id="logoutBtn" class="btn btn-logout">
          <!-- Right from bracket icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 17l1.414-1.414L9.828 14H20v-4H9.828l1.586-1.586L10 7l-5 5 5 5zM4 5h6V3H4a2 2 0 00-2 2v14a2 2 0 002 2h6v-2H4V5z"/>
          </svg>
          Sign Out
        </button>
      </div>

      <!-- Login View -->
      <div id="loginView" class="view">
        <div class="logo">PromptOK</div>
        
        <div class="form-group">
          <input id="email" type="email" placeholder="Email address" class="input" />
          <input id="password" type="password" placeholder="Password" class="input" />
        </div>
        
        <button id="login" class="btn btn-primary">Sign In</button>
        <button id="googleLogin" class="btn btn-google" style="margin-top:8px;">
          <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12S17.373 12 24 12c3.059 0 5.842 1.156 7.963 3.037l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.651-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 16.108 18.961 12 24 12c3.059 0 5.842 1.156 7.963 3.037l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.171 0 9.86-1.977 13.409-5.197l-6.2-5.238C29.141 35.091 26.715 36 24 36c-5.202 0-9.62-3.317-11.278-7.952l-6.49 5.005C9.545 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-0.793 2.239-2.231 4.166-4.094 5.565 0.001-0.001 0.002-0.001 0.003-0.002l6.2 5.238C35.132 40.31 44 34 44 24 44 22.659 43.862 21.349 43.611 20.083z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>
        <button id="showSignup" class="btn btn-text">Don't have an account? <span>Sign up</span></button>
        
        <div class="status" id="status"></div>
      </div>

      <!-- Signup View -->
      <div id="signupView" class="view" style="display: none;">
        <div class="logo">PromptOK</div>
        
        <div class="form-group">
          <input id="displayName" type="text" placeholder="Full name" class="input" />
          <input id="signupEmail" type="email" placeholder="Email address" class="input" />
          <input id="signupPassword" type="password" placeholder="Create password" class="input" />
          <input id="confirmPassword" type="password" placeholder="Confirm password" class="input" />
        </div>
        
        <button id="signup" class="btn btn-primary">Create Account</button>
        <button id="googleLoginSignup" class="btn btn-google" style="margin-top:8px;">
          <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12S17.373 12 24 12c3.059 0 5.842 1.156 7.963 3.037l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.651-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 16.108 18.961 12 24 12c3.059 0 5.842 1.156 7.963 3.037l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.171 0 9.86-1.977 13.409-5.197l-6.2-5.238C29.141 35.091 26.715 36 24 36c-5.202 0-9.62-3.317-11.278-7.952l-6.49 5.005C9.545 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-0.793 2.239-2.231 4.166-4.094 5.565 0.001-0.001 0.002-0.001 0.003-0.002l6.2 5.238C35.132 40.31 44 34 44 24 44 22.659 43.862 21.349 43.611 20.083z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>
        <button id="showLogin" class="btn btn-text">Already have an account? <span>Sign in</span></button>
        
        <div class="status" id="signupStatus"></div>
      </div>
    </div>
    
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
